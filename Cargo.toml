[package]
name = "gmsv_waterlevelercore"
version = "0.1.0"
edition = "2021"
description = "Garry's Mod binary module (server and client): per-entity water level overrides and fake water volumes"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Margen67/Waterleveler"
readme = ".github/README.md"
keywords = ["garrys-mod", "gmod", "water"]
categories = ["game-development"]

# `gmod` wraps the Lua C API (it loads lua_shared at runtime, so there is no import library).
# `region` changes code protection and allocates trampolines, `libloading` gets engine functions.
# Its default `hax` feature (signature scanning and detours) is not used. It needs Rust nightly.
[dependencies]
gmod = { version = "17", default-features = false }
libloading = "0.9.1"
region = "4.0.2"

# Windows: the engine modules, the code protection and the instruction cache.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }

# Linux: the loaded-object list (`dl_iterate_phdr`) and `dladdr`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

# One DLL per realm: `server` (gmsv_) and `client` (gmcl_). The release builds enable one
# each (see build.sh and build.ps1), so each carries only the code it needs; the default has both,
# which is what the tests need, and then the realm is chosen from the DLL's file name.
[features]
default = ["server", "client"]
server = []
client = []

[lib]
name = "gmsv_waterlevelercore"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Every lint on, including the pedantic and cargo groups, except the ones that
# are wrong for this crate (each is explained next to its entry).
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Wrong for this crate:
# - The module only builds for x86_64 (the engine's 64-bit branch), so pointer-width casts
#   cannot truncate or wrap.
# - Lua numbers are doubles; every conversion to an integer or f32 is of a value the code
#   has bounded (clamped arguments, small engine offsets), and converting is the point.
# - Pointers are cast into engine objects whose fields really are aligned; the lint only sees
#   `*const u8`.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_ptr_alignment = "allow"
# Contradicts the rustc lint `unreachable_pub` (one asks for `pub(crate)` on exactly the
# items the other wants plain `pub`), so only `unreachable_pub` is kept.
redundant_pub_crate = "allow"
# Every source file starts with `use crate::*;`: the crate root re-exports each module's
# items (`pub(crate) use shared::*;` and so on), so the files that were once one namespace
# can see each other without hundreds of explicit imports. Only the crate's own items are
# glob-imported, never an external crate's.
wildcard_imports = "allow"
