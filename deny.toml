[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2

[licenses]
version = 2
# The allow-list covers licenses the dependencies may use in the future too.
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `gmod`'s macro crate is on syn 1 and `zerocopy`'s derive on syn 2. Both only run at build
# time (proc macros), so neither version reaches the DLL. Remove this when gmod moves to syn 2.
skip = [
    { crate = "syn@1.0.109", reason = "gmod-macros still uses syn 1; build-time only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
