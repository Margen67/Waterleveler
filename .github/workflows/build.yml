name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  lua:
    name: Lua
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install GLuaFixer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          gh release download --repo FPtje/GLuaFixer --pattern '*-x86_64-linux.zip'
          unzip -q glualint-*-x86_64-linux.zip
          ./glualint --version

      - name: Lint
        run: ./glualint --output-format github lint .

      - name: Check formatting
        run: |-
          ./glualint --pretty-print-files addon
          find addon -name '*.lua' -exec sed -i '1s/^\xEF\xBB\xBF//' {} +
          git diff --exit-code

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Lint the shell scripts
        run: shellcheck build.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Lint the workflows
        run: docker run --rm -v "${PWD}:/repo" --workdir /repo rhysd/actionlint:latest -color

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint the PowerShell scripts
        run: |-
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse
          $findings | Format-List
          if ($findings) { exit 1 }

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install cargo-deny
        uses: taiki-e/install-action@main
        with:
          tool: cargo-deny

      - name: Check advisories, licenses, bans and sources
        run: cargo deny check --deny warnings

  outdated:
    name: cargo-outdated
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Cache cargo-outdated
        id: cache
        uses: actions/cache@main
        with:
          path: ~/.cargo/bin/cargo-outdated
          key: cargo-outdated-${{ runner.os }}

      - name: Install cargo-outdated
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-outdated

      - name: Check for outdated crates
        run: cargo outdated --root-deps-only --exit-code 1

  machete:
    name: cargo-machete
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install cargo-machete
        uses: taiki-e/install-action@main
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

  shear:
    name: cargo-shear
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install cargo-shear
        uses: taiki-e/install-action@main
        with:
          tool: cargo-shear

      - name: Check for unused and misplaced dependencies
        run: cargo shear --deny-warnings

  udeps:
    name: cargo-udeps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each OS compiles its own target-specific dependencies (windows-sys, libc).
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Use Rust nightly
        run: |-
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Install cargo-udeps
        uses: taiki-e/install-action@main
        with:
          tool: cargo-udeps

      - name: Check for unused dependencies
        run: |-
          cargo udeps --locked --all-targets
          cargo udeps --locked --all-targets --no-default-features --features server
          cargo udeps --locked --all-targets --no-default-features --features client

  luals:
    name: LuaLS
    uses: CFC-Servers/gmod_luals_workflow/.github/workflows/luals.yml@main
    with:
      style_check: true

  build:
    name: Windows x64
    needs: [ lua, luals, shellcheck, actionlint, psscriptanalyzer, deny, outdated, machete, shear, udeps ]
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
      # Any warning from rustc, clippy or cargo itself fails the build.
      RUSTFLAGS: -D warnings
      CARGO_BUILD_WARNINGS: deny

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Use Rust nightly
        run: |-
          rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
          rustup default nightly
          rustc --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: |-
          cargo clippy --release --locked --all-targets
          cargo clippy --release --locked --no-default-features --features server
          cargo clippy --release --locked --no-default-features --features client

      - name: Build the server module
        run: cargo build --release --locked --no-default-features --features server

      - name: Collect the server module
        run: |-
          New-Item -ItemType Directory -Force package/garrysmod/lua/bin, package/garrysmod/addons/waterleveler | Out-Null
          Copy-Item target/release/gmsv_waterlevelercore.dll package/garrysmod/lua/bin/gmsv_waterlevelercore_win64.dll

      - name: Build the client module
        run: cargo build --release --locked --no-default-features --features client

      - name: Collect the client module
        run: Copy-Item target/release/gmsv_waterlevelercore.dll package/garrysmod/lua/bin/gmcl_waterlevelercore_win64.dll

      - name: Assemble the garrysmod folder
        run: |-
          Copy-Item -Recurse -Force addon/waterleveler/* package/garrysmod/addons/waterleveler/
          Copy-Item LICENSE package/garrysmod/addons/waterleveler/LICENSE
          Get-ChildItem package -Recurse -File | Sort-Object FullName | ForEach-Object FullName

      - name: Create the 7z archive
        working-directory: package
        run: 7z a -mx9 -bb3 ../waterleveler.7z garrysmod

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          path: waterleveler.7z
          archive: false
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: [ lua, luals, shellcheck, actionlint, psscriptanalyzer, deny, outdated, machete, shear, udeps ]
    runs-on: ubuntu-latest
    env:
      # Any warning from rustc, clippy or cargo itself fails the build.
      RUSTFLAGS: -D warnings
      CARGO_BUILD_WARNINGS: deny

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Use Rust nightly
        run: |-
          rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
          rustup default nightly
          rustc --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: |-
          cargo clippy --release --locked --all-targets
          cargo clippy --release --locked --no-default-features --features server
          cargo clippy --release --locked --no-default-features --features client

      # The tests that need the game's own server.so and client.so skip themselves when
      # SERVER_SO_X64 and CLIENT_SO_X64 are not set (the binaries are not redistributable).
      - name: Test
        run: cargo test --locked

      - name: Build the server module
        run: cargo build --release --locked --no-default-features --features server

      - name: Collect the server module
        run: |-
          mkdir -p package/garrysmod/lua/bin package/garrysmod/addons/waterleveler
          cp target/release/libgmsv_waterlevelercore.so package/garrysmod/lua/bin/gmsv_waterlevelercore_linux64.dll

      - name: Build the client module
        run: cargo build --release --locked --no-default-features --features client

      - name: Collect the client module
        run: cp target/release/libgmsv_waterlevelercore.so package/garrysmod/lua/bin/gmcl_waterlevelercore_linux64.dll

      - name: Assemble the garrysmod folder
        run: |-
          cp -r addon/waterleveler/. package/garrysmod/addons/waterleveler/
          cp LICENSE package/garrysmod/addons/waterleveler/LICENSE
          find package -type f | sort

      - name: Create the 7z archive
        working-directory: package
        run: 7z a -mx9 -bb3 ../waterleveler-linux.7z garrysmod

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          path: waterleveler-linux.7z
          archive: false
          if-no-files-found: error
